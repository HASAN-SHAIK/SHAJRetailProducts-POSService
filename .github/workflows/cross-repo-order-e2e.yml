name: Cross-repo Order E2E
# Exact-head release rerun: no assertion or runtime behavior change.

on:
  pull_request:
    paths:
      - 'internal/syncengine/**'
      - 'internal/server/order_vertical_slice_test.go'
      - 'docs/V1-TRANSACTION-ACCEPTANCE-MATRIX.md'
      - 'docs/V1_FRONTEND_COMPLETION_ACCEPTANCE_MATRIX.md'
      - '.github/workflows/cross-repo-order-e2e.yml'
  workflow_dispatch:

jobs:
  order-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGPASSWORD: postgres
      MASTER_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/masterdb
      TENANT_DATABASE_URL_TEMPLATE: postgres://postgres:postgres@127.0.0.1:5432/{db}
      DB_SSL: 'false'
      POS_SYNC_TENANT_ID: tenant-e2e
      POS_SYNC_TOKEN: sync-secret
      POS_E2E_CENTRAL_URL: http://127.0.0.1:5001
      POS_E2E_TENANT_ID: tenant-e2e
      POS_E2E_SYNC_TOKEN: sync-secret
      POS_E2E_DEVICE_ID: device-e2e

    steps:
      - name: Checkout POS Service
        uses: actions/checkout@v4

      - name: Checkout merged Backend main
        uses: actions/checkout@v4
        with:
          repository: HASAN-SHAIK/SHAJRetailProducts-Backend
          ref: main
          path: backend

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create real master and tenant PostgreSQL databases
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE DATABASE masterdb;
          CREATE DATABASE tenant_e2e;
          SQL

          psql -h 127.0.0.1 -U postgres -d masterdb -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE tenants (
            id TEXT PRIMARY KEY,
            shop_name TEXT,
            owner_name TEXT,
            email TEXT,
            mobile TEXT,
            plan_type TEXT,
            is_active BOOLEAN NOT NULL DEFAULT TRUE,
            addons JSONB NOT NULL DEFAULT '{}'::jsonb,
            gst_mode TEXT,
            database_name TEXT NOT NULL
          );
          INSERT INTO tenants(id, shop_name, owner_name, email, mobile, plan_type, is_active, addons, gst_mode, database_name)
          VALUES('tenant-e2e', 'E2E Shop', 'E2E Owner', 'e2e@example.test', '0000000000', 'pro', TRUE, '{}'::jsonb, 'INCLUSIVE', 'tenant_e2e');
          SQL

          psql -h 127.0.0.1 -U postgres -d tenant_e2e -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE orders (
            id BIGSERIAL PRIMARY KEY,
            client_order_id TEXT,
            customer_id BIGINT,
            total_price NUMERIC(14,2) NOT NULL DEFAULT 0,
            total_paid NUMERIC(14,2) NOT NULL DEFAULT 0,
            order_status TEXT NOT NULL DEFAULT 'pending',
            transaction_type TEXT,
            billing_type TEXT,
            created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
            updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
            is_deleted BOOLEAN NOT NULL DEFAULT FALSE
          );
          CREATE TABLE order_items (
            id BIGSERIAL PRIMARY KEY,
            order_id BIGINT NOT NULL,
            product_id BIGINT,
            quantity NUMERIC(14,3) NOT NULL DEFAULT 0,
            selling_price NUMERIC(14,2) NOT NULL DEFAULT 0,
            discount_amount NUMERIC(14,2) NOT NULL DEFAULT 0,
            gst_percent NUMERIC(8,3) NOT NULL DEFAULT 0
          );
          SQL

          psql -h 127.0.0.1 -U postgres -d tenant_e2e -v ON_ERROR_STOP=1 -f backend/Db/migrations/2026-08-07-pos-sync-events.sql
          psql -h 127.0.0.1 -U postgres -d tenant_e2e -v ON_ERROR_STOP=1 -f backend/Db/migrations/2026-08-07-pos-sale-projections.sql
          psql -h 127.0.0.1 -U postgres -d tenant_e2e -v ON_ERROR_STOP=1 -f backend/Db/migrations/2026-08-08-canonical-pos-orders.sql
          psql -h 127.0.0.1 -U postgres -d tenant_e2e -v ON_ERROR_STOP=1 -f backend/Db/migrations/2026-08-08-pos-cashier-audit.sql

      - name: Install backend runtime dependencies
        working-directory: backend
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Start production POS sync route against PostgreSQL
        run: |
          cat > backend/e2e-pos-sync-server.js <<'NODE'
          const express = require('express');
          const router = require('./src/api/v1/modules/sync/posSync.routes');
          const app = express();
          app.use(express.json({ limit: '5mb' }));
          app.use('/api/v1/sync', router);
          app.use((error, req, res, next) => {
            console.error(error);
            res.status(500).json({ code: error.code || 'E2E_SERVER_ERROR', message: error.message });
          });
          const server = app.listen(5001, '127.0.0.1', () => console.log('POS sync E2E server listening on 5001'));
          const shutdown = () => server.close(() => process.exit(0));
          process.on('SIGTERM', shutdown);
          process.on('SIGINT', shutdown);
          NODE

          node backend/e2e-pos-sync-server.js >/tmp/pos-central-e2e.log 2>&1 &
          echo $! >/tmp/pos-central-e2e.pid

          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:5001/api/v1/sync/events || true)
            if [ "$code" = "401" ]; then exit 0; fi
            sleep 1
          done
          cat /tmp/pos-central-e2e.log
          exit 1

      - name: Dispatch SQLite outbox to real central API and replay
        run: CGO_ENABLED=1 go test ./internal/syncengine -run '^TestRealCentralOrderE2E$' -count=1 -v

      - name: Verify exactly-once PostgreSQL projections and pricing snapshots
        run: |
          assert_one() {
            local sql="$1"
            local label="$2"
            local count
            count=$(psql -h 127.0.0.1 -U postgres -d tenant_e2e -At -v ON_ERROR_STOP=1 -c "$sql")
            if [ "$count" != "1" ]; then
              echo "$label expected exactly 1 row, got $count"
              exit 1
            fi
          }

          assert_one "SELECT COUNT(*) FROM pos_sync_events WHERE event_id='evt-cross-repo-order-e2e' AND processed_at IS NOT NULL" "processed sync event"
          assert_one "SELECT COUNT(*) FROM pos_sales WHERE order_id='ord-cross-repo-e2e' AND source_event_id='evt-cross-repo-order-e2e'" "sale"
          assert_one "SELECT COUNT(*) FROM pos_sale_items WHERE order_id='ord-cross-repo-e2e' AND item_id='itm-cross-repo-e2e'" "sale item"
          assert_one "SELECT COUNT(*) FROM pos_sale_payments WHERE order_id='ord-cross-repo-e2e' AND payment_id='pay-cross-repo-e2e'" "payment"
          assert_one "SELECT COUNT(*) FROM pos_sale_receipts WHERE order_id='ord-cross-repo-e2e' AND receipt_id='rcpt-cross-repo-e2e'" "receipt"
          assert_one "SELECT COUNT(*) FROM pos_inventory_movements WHERE order_id='ord-cross-repo-e2e' AND movement_id='mov-cross-repo-e2e'" "inventory movement"
          assert_one "SELECT COUNT(*) FROM orders WHERE source_channel='pos' AND source_order_id='ord-cross-repo-e2e'" "canonical order"

          assert_one "SELECT COUNT(*) FROM pos_sales WHERE order_id='ord-cross-repo-e2e' AND subtotal_minor=12500 AND discount_minor=500 AND tax_minor=2160 AND total_minor=14160" "POS sale pricing snapshot"
          assert_one "SELECT COUNT(*) FROM pos_sale_items WHERE item_id='itm-cross-repo-e2e' AND unit_price_minor=12500 AND discount_minor=500 AND tax_minor=2160 AND line_total_minor=14160 AND tax_code='HSN0401'" "POS sale item pricing snapshot"
          assert_one "SELECT COUNT(*) FROM orders WHERE source_channel='pos' AND source_order_id='ord-cross-repo-e2e' AND subtotal_minor=12500 AND discount_minor=500 AND tax_minor=2160 AND total_minor=14160 AND total_price=141.60" "canonical order pricing snapshot"
          assert_one "SELECT COUNT(*) FROM order_items oi JOIN orders o ON o.id=oi.order_id WHERE o.source_channel='pos' AND o.source_order_id='ord-cross-repo-e2e' AND oi.unit_price_minor=12500 AND oi.source_discount_minor=500 AND oi.tax_minor=2160 AND oi.line_total_minor=14160 AND oi.tax_code='HSN0401'" "canonical order item pricing snapshot"

      - name: Show backend log on failure
        if: failure()
        run: cat /tmp/pos-central-e2e.log || true

      - name: Stop E2E backend
        if: always()
        run: |
          if [ -f /tmp/pos-central-e2e.pid ]; then kill "$(cat /tmp/pos-central-e2e.pid)" || true; fi
