name: V1 inventory refund fixture patch

on:
  push:
    branches:
      - v1/inventory-central-convergence-e2e
    paths:
      - '.github/workflows/v1-inventory-refund-fixture-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1/inventory-central-convergence-e2e
          fetch-depth: 0

      - name: Apply exact fixture alignment
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path('internal/syncengine/real_refund_e2e_test.go'): [
                  ('product-refund-e2e', '101'),
              ],
              Path('internal/syncengine/real_partial_return_e2e_test.go'): [
                  ('product-partial-return-e2e', '102'),
              ],
          }
          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  count = text.count(old)
                  if count == 0:
                      raise SystemExit(f'{path}: expected {old!r} at least once')
                  text = text.replace(old, new)
              path.write_text(text)

          migration_anchor = "          psql -h 127.0.0.1 -U postgres -d tenant_e2e -v ON_ERROR_STOP=1 -f backend/Db/migrations/2026-08-07-pos-inventory-movement-recorded.sql\n"
          migration_line = "          psql -h 127.0.0.1 -U postgres -d tenant_e2e -v ON_ERROR_STOP=1 -f backend/Db/migrations/2026-08-13-pos-inventory-canonical-application.sql\n"

          fixture_specs = [
              (
                  Path('.github/workflows/cross-repo-refund-e2e.yml'),
                  101,
                  '4.000',
                  '5.000',
                  'central inventory restoration',
              ),
              (
                  Path('.github/workflows/cross-repo-partial-return-e2e.yml'),
                  102,
                  '4.000',
                  '4.250',
                  'central partial inventory restoration',
              ),
          ]

          for path, product_id, starting_stock, expected_stock, inventory_label in fixture_specs:
              text = path.read_text()
              if migration_line not in text:
                  if text.count(migration_anchor) != 1:
                      raise SystemExit(f'{path}: inventory migration anchor count != 1')
                  text = text.replace(migration_anchor, migration_anchor + migration_line)

              products_sql = f"""          CREATE TABLE products (\n            id BIGINT PRIMARY KEY,\n            stock_quantity NUMERIC(14,3) NOT NULL DEFAULT 0,\n            updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),\n            is_deleted BOOLEAN NOT NULL DEFAULT FALSE\n          );\n          INSERT INTO products(id, stock_quantity, updated_at, is_deleted)\n          VALUES({product_id}, {starting_stock}, NOW(), FALSE);\n"""
              order_items_end = """          CREATE TABLE order_items (\n            id BIGSERIAL PRIMARY KEY,\n            order_id BIGINT NOT NULL,\n            product_id BIGINT,\n            quantity NUMERIC(14,3) NOT NULL DEFAULT 0,\n            selling_price NUMERIC(14,2) NOT NULL DEFAULT 0,\n            discount_amount NUMERIC(14,2) NOT NULL DEFAULT 0,\n            gst_percent NUMERIC(8,3) NOT NULL DEFAULT 0\n          );\n"""
              if products_sql not in text:
                  if text.count(order_items_end) != 1:
                      raise SystemExit(f'{path}: order_items fixture anchor count != 1')
                  text = text.replace(order_items_end, order_items_end + products_sql)

              stock_assert = f'''          assert_one "SELECT COUNT(*) FROM products WHERE id={product_id} AND stock_quantity={expected_stock}" "canonical product stock restoration"\n'''
              label_anchor = f' "{inventory_label}"\n'
              if stock_assert not in text:
                  idx = text.find(label_anchor)
                  if idx < 0:
                      raise SystemExit(f'{path}: inventory assertion anchor missing')
                  insert_at = idx + len(label_anchor)
                  text = text[:insert_at] + stock_assert + text[insert_at:]

              path.write_text(text)

      - name: Validate focused diff
        run: |
          set -euo pipefail
          grep -q "VALUES('101','Refund E2E Product'" internal/syncengine/real_refund_e2e_test.go
          ! grep -q 'product-refund-e2e' internal/syncengine/real_refund_e2e_test.go
          grep -q "VALUES('102','Partial Return E2E Product'" internal/syncengine/real_partial_return_e2e_test.go
          ! grep -q 'product-partial-return-e2e' internal/syncengine/real_partial_return_e2e_test.go
          grep -q '2026-08-13-pos-inventory-canonical-application.sql' .github/workflows/cross-repo-refund-e2e.yml
          grep -q '2026-08-13-pos-inventory-canonical-application.sql' .github/workflows/cross-repo-partial-return-e2e.yml
          grep -q 'stock_quantity=5.000' .github/workflows/cross-repo-refund-e2e.yml
          grep -q 'stock_quantity=4.250' .github/workflows/cross-repo-partial-return-e2e.yml
          git diff --check
          changed=$(git diff --name-only | sort)
          expected=$(printf '%s\n' \
            .github/workflows/cross-repo-partial-return-e2e.yml \
            .github/workflows/cross-repo-refund-e2e.yml \
            internal/syncengine/real_partial_return_e2e_test.go \
            internal/syncengine/real_refund_e2e_test.go | sort)
          test "$changed" = "$expected"

      - name: Commit fixture alignment and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/v1-inventory-refund-fixture-patch.yml
          git add .github/workflows/cross-repo-refund-e2e.yml \
                  .github/workflows/cross-repo-partial-return-e2e.yml \
                  internal/syncengine/real_refund_e2e_test.go \
                  internal/syncengine/real_partial_return_e2e_test.go
          git commit -m 'Align refund inventory E2E with canonical stock'
          git push origin HEAD:v1/inventory-central-convergence-e2e
