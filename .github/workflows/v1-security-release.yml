name: V1 Security release acceptance

on:
  pull_request:
    paths:
      - 'docs/V1_SECURITY_ACCEPTANCE_MATRIX.md'
      - '.github/workflows/v1-security-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pos-security-main:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Run merged POS Security acceptance
        run: go test ./internal/config ./internal/security
      - name: Test all POS packages
        run: go test ./...
      - name: Vet POS service
        run: go vet ./...
      - name: Build packaged POS runtime
        run: go build ./cmd/posservice

  backend-security-main:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: HASAN-SHAIK/SHAJRetailProducts-Backend
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Backend dependencies from lockfile
        run: npm ci --ignore-scripts
      - name: Verify Backend dependency tree
        run: npm ls --depth=0
      - name: Run merged Backend Security acceptance
        run: >-
          npx jest
          tests/v1SecurityCorsPolicy.test.js
          tests/v1SecurityAuthRateLimits.test.js
          tests/v1SecurityDatabaseTlsPolicy.test.js
          tests/v1SecurityDbTimingLogHygiene.test.js
          tests/v1SecurityImportBoundary.test.js
          tests/v1SecurityInvoiceUploadPolicy.test.js
          tests/v1SecurityPlatformAdminSeedPolicy.test.js
          tests/v1SecurityRabbitmqConfig.test.js
          tests/v1SecurityDynamicSqlInventory.test.js
          tests/v1SecuritySupportNotificationPolicy.test.js
          tests/v1SecurityContainerRuntime.test.js
          tests/v1AuthCookieSecretHardening.test.js
          tests/v1CrossTenantAuthIsolation.test.js
          --runInBand

  frontend-security-main:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: HASAN-SHAIK/SHAJRetailProducts-Frontend
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install Frontend dependencies from lockfile
        run: npm ci
      - name: Run merged Frontend Security acceptance
        env:
          CI: 'true'
        run: npm test -- --watchAll=false --runTestsByPath src/v1SecuritySupplyChainAcceptance.test.js
      - name: Build merged production Frontend
        run: CI=false npm run build
