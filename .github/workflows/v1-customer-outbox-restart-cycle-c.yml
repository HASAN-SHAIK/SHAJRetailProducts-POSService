name: V1 Customer Outbox Restart Cycle C

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact head
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          echo "EXACT_HEAD=$(git rev-parse HEAD)"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Focused customer outbox acceptance
        run: go test ./internal/customer -run '^TestCreateAndUpdateEmitVersionedCustomerEvents$' -count=1 -v

      - name: Focused outbox ordering acceptance
        run: go test ./internal/outbox -run 'Ordering|Identity' -count=1 -v

      - name: Full Go suite
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build production POSService
        run: go build -o /tmp/posservice-cycle-c ./cmd/posservice

      - name: Check runtime harness
        run: |
          bash -n tests/v1-customer-outbox-restart-runtime.sh
          python3 -m py_compile tests/customer-outbox-restart-central.py

      - name: Real customer HTTP writes, POS restart, and Central drain
        run: bash tests/v1-customer-outbox-restart-runtime.sh /tmp/posservice-cycle-c
