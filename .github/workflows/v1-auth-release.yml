name: V1 Authentication Authorization release acceptance

on:
  pull_request:
    paths:
      - 'docs/V1_AUTH_AUTHORIZATION_ACCEPTANCE_MATRIX.md'
      - '.github/workflows/v1-auth-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pos-auth-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Test all POS packages
        run: go test ./...
      - name: Vet POS service
        run: go vet ./...
      - name: Build packaged POS runtime
        run: go build ./cmd/posservice

  central-auth-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: v1_auth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d v1_auth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      V1_AUTH_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/v1_auth
    steps:
      - uses: actions/checkout@v4
        with:
          repository: HASAN-SHAIK/SHAJRetailProducts-Backend
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - name: Run merged Central V1 Auth authority acceptance
        run: >-
          npx jest
          src/middleware/authTenant.v1Acceptance.test.js
          tests/tenantUserController.test.js
          src/utils/rolePermissions.test.js
          src/controllers/offlineGrantController.test.js
          tests/v1AuthRefreshPostgres.test.js
          tests/v1PlatformAdminAuth.test.js
          tests/v1PublicRegistrationBoundary.test.js
          tests/v1ProtectedRoutePermissions.test.js
          tests/v1PurchaseExpensePermissions.test.js
          tests/v1AccountingPermissions.test.js
          tests/v1AuthDeviceValidation.test.js
          tests/v1TenantRevocationAuthority.test.js
          tests/v1AdminFinancePermissions.test.js
          tests/v1LegacyReturnPermissions.test.js
          tests/v1CrossTenantAuthIsolation.test.js
          tests/v1AuthCookieSecretHardening.test.js
          --runInBand

  frontend-auth-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: HASAN-SHAIK/SHAJRetailProducts-Frontend
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run merged Frontend Auth acceptance
        run: >-
          CI=true npm test -- --watchAll=false
          src/components/common/authFrontend.v1Acceptance.test.js
      - name: Build production frontend
        run: CI=false npm run build
