name: V1 Login Null Payload Cycle C

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact head
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          echo "EXACT_HEAD=$(git rev-parse HEAD)"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Runtime harness syntax
        run: bash -n tests/v1-login-null-payload-runtime.sh

      - name: Focused null-payload login regression
        id: focused
        continue-on-error: true
        run: go test ./internal/server -run '^TestLocalAuthLoginRejectsNullJSONPayload$' -count=1 -v

      - name: Relevant complete Go suite
        id: suite
        continue-on-error: true
        run: go test ./...

      - name: Go vet
        run: go vet ./...

      - name: Build runnable POSService
        run: go build -o /tmp/posservice-cycle-c ./cmd/posservice

      - name: Real null-payload login application runtime
        id: runtime
        continue-on-error: true
        run: bash tests/v1-login-null-payload-runtime.sh /tmp/posservice-cycle-c

      - name: Record certification result
        shell: bash
        run: |
          echo "FOCUSED_OUTCOME=${{ steps.focused.outcome }}"
          echo "SUITE_OUTCOME=${{ steps.suite.outcome }}"
          echo "RUNTIME_OUTCOME=${{ steps.runtime.outcome }}"
          if [[ "${{ steps.focused.outcome }}" != success || "${{ steps.suite.outcome }}" != success || "${{ steps.runtime.outcome }}" != success ]]; then
            echo 'NULL_LOGIN_CERTIFICATION=FAIL'
            exit 1
          fi
          echo 'NULL_LOGIN_CERTIFICATION=PASS'
