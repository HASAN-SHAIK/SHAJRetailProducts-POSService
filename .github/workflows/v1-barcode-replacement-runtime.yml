name: V1 barcode replacement runtime certification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Focused barcode replacement live runtime
        run: go test ./internal/server -run '^TestPrimaryBarcodeReplacementUpdatesLiveCatalogHTTP$' -count=1 -v
      - name: Full POSService suite
        run: go test ./...
      - name: Vet POSService
        run: go vet ./...
      - name: Build POSService executable
        run: go build ./cmd/posservice
