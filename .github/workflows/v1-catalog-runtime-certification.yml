name: V1 catalog runtime certification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Focused live catalog runtime test
        run: go test ./internal/server -run '^TestV1CatalogRuntimeHTTPSearchBarcodeProductAndCategories$' -count=1 -v
      - name: Full POS suite
        run: go test ./...
      - name: Vet POS service
        run: go vet ./...
      - name: Build POS service
        run: go build ./cmd/posservice
