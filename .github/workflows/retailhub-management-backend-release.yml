name: RetailHub management Backend acceptance

on:
  pull_request:
    paths:
      - 'docs/RETAILHUB_MANAGEMENT_MIGRATION_CERTIFICATION.md'
      - '.github/workflows/retailhub-management-pos-release.yml'
      - '.github/workflows/retailhub-management-backend-release.yml'
      - '.github/workflows/retailhub-management-frontend-release.yml'
      - '.github/workflows/retailhub-management-hub-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-central-main:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: HASAN-SHAIK/SHAJRetailProducts-Backend
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Complete Backend Jest suite
        run: npm test -- --runInBand
      - name: Production container build
        run: docker build -t shajretail-backend:retailhub-management-cert .
