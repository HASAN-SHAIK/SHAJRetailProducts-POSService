name: V1 Sync ACK Loss Runtime Cycle C

on:
  pull_request:
    paths:
      - '.github/workflows/v1-sync-ack-loss-runtime-cycle-c.yml'
      - 'internal/syncengine/**'
      - 'internal/outbox/**'
      - 'cmd/posservice/**'
      - 'internal/config/**'
      - 'internal/database/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Exact-head assertion
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          echo "EXACT_HEAD=$(git rev-parse HEAD)"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Focused ACK-loss automated test
        run: go test ./internal/syncengine -run '^TestRefundEventRecoversWhenCentralAcceptsButAcknowledgementIsLost$' -count=1 -v

      - name: Relevant repository suite
        run: |
          go test ./...
          go vet ./...
          go build -o /tmp/posservice ./cmd/posservice

      - name: Real POSService ACK-loss runtime
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME="$(mktemp -d)"
          DB="$RUNTIME/pos.db"
          CENTRAL_LOG="$RUNTIME/central.log"
          POS_LOG="$RUNTIME/pos.log"

          cat > "$RUNTIME/central.py" <<'PY'
          import json, os
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          accepted=set()
          requests=[]
          log_path=os.environ['CENTRAL_LOG']
          class Handler(BaseHTTPRequestHandler):
              def log_message(self, *args): pass
              def _record(self, text):
                  with open(log_path,'a',encoding='utf-8') as f: f.write(text+'\n')
              def do_POST(self):
                  if self.path != '/api/v1/sync/events':
                      self.send_response(404); self.end_headers(); return
                  n=int(self.headers.get('Content-Length','0'))
                  body=self.rfile.read(n)
                  envelope=json.loads(body)
                  key=self.headers.get('Idempotency-Key','')
                  requests.append(key)
                  self._record(f"POST key={key} event={envelope.get('event_id')} request={len(requests)}")
                  if key not in accepted:
                      accepted.add(key)
                      self._record(f"ACCEPT key={key}")
                      # Simulate Central durable commit followed by loss of the HTTP acknowledgement.
                      self.close_connection=True
                      try:
                          self.connection.shutdown(2)
                      except OSError:
                          pass
                      self.connection.close()
                      return
                  payload=json.dumps({'code':'SYNC_EVENT_ALREADY_RECEIVED','event_id':key}).encode()
                  self.send_response(409)
                  self.send_header('Content-Type','application/json')
                  self.send_header('Content-Length',str(len(payload)))
                  self.end_headers(); self.wfile.write(payload)
                  self._record(f"DUP_ACK key={key}")
              def do_GET(self):
                  payload=b'{"changes":[],"next_cursor":"","has_more":false}'
                  self.send_response(200)
                  self.send_header('Content-Type','application/json')
                  self.send_header('Content-Length',str(len(payload)))
                  self.end_headers(); self.wfile.write(payload)
          ThreadingHTTPServer(('127.0.0.1',43142),Handler).serve_forever()
          PY

          CENTRAL_LOG="$CENTRAL_LOG" python3 "$RUNTIME/central.py" &
          CENTRAL_PID=$!
          trap 'kill ${POS_PID:-0} ${CENTRAL_PID:-0} 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            if python3 - <<'PY'
          import socket
          s=socket.socket(); s.settimeout(.1)
          try: s.connect(('127.0.0.1',43142)); ok=True
          except OSError: ok=False
          finally: s.close()
          raise SystemExit(0 if ok else 1)
          PY
            then break; fi
            sleep .1
          done

          POS_ENVIRONMENT=development \
          POS_LISTEN_ADDRESS=127.0.0.1:43141 \
          POS_SQLITE_PATH="$DB" \
          POS_DEVICE_ID=device-ack-loss-runtime \
          POS_INSTALLATION_ID=install-ack-loss-runtime \
          POS_LOCAL_API_TOKEN=local-runtime-token \
          POS_CENTRAL_API_URL=http://127.0.0.1:43142 \
          POS_SYNC_TENANT_ID=tenant-runtime \
          POS_SYNC_TOKEN=sync-runtime-token \
          POS_SYNC_INTERVAL=100ms \
          POS_SYNC_REQUEST_TIMEOUT=1s \
          /tmp/posservice >"$POS_LOG" 2>&1 &
          POS_PID=$!

          for i in $(seq 1 100); do
            if [ -f "$DB" ] && sqlite3 "$DB" "SELECT 1 FROM sqlite_master WHERE type='table' AND name='outbox_events';" | grep -q 1; then break; fi
            kill -0 "$POS_PID"
            sleep .1
          done

          NOW="$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)"
          sqlite3 "$DB" <<SQL
          INSERT INTO outbox_events(
            id,aggregate_type,aggregate_id,aggregate_version,event_type,schema_version,
            ordering_key,payload_json,metadata_json,status,attempt_count,available_at,created_at
          ) VALUES(
            'evt-runtime-ack-loss','sales_order','ord-runtime-ack-loss',3,'sale.partial_returned',1,
            'sales_order:ord-runtime-ack-loss','{"return_id":"ret-runtime-ack-loss","refund_minor":2500}',
            '{"source":"pos_service"}','pending',0,'$NOW','$NOW'
          );
          SQL

          FAILED_SEEN=false
          for i in $(seq 1 80); do
            STATE="$(sqlite3 "$DB" "SELECT status||':'||attempt_count FROM outbox_events WHERE id='evt-runtime-ack-loss';")"
            if [[ "$STATE" == failed:* ]]; then FAILED_SEEN=true; echo "ACK_LOSS_LOCAL_RETRYABLE=$STATE"; break; fi
            kill -0 "$POS_PID"
            sleep .1
          done
          test "$FAILED_SEEN" = true

          for i in $(seq 1 100); do
            STATE="$(sqlite3 "$DB" "SELECT status||':'||attempt_count||':'||CASE WHEN published_at IS NULL THEN 'null' ELSE 'set' END FROM outbox_events WHERE id='evt-runtime-ack-loss';")"
            if [[ "$STATE" == published:*:set ]]; then echo "ACK_LOSS_FINAL_STATE=$STATE"; break; fi
            kill -0 "$POS_PID"
            sleep .2
          done
          [[ "$STATE" == published:*:set ]]

          REQUESTS="$(grep -c '^POST key=evt-runtime-ack-loss ' "$CENTRAL_LOG")"
          ACCEPTS="$(grep -c '^ACCEPT key=evt-runtime-ack-loss$' "$CENTRAL_LOG")"
          DUP_ACKS="$(grep -c '^DUP_ACK key=evt-runtime-ack-loss$' "$CENTRAL_LOG")"
          test "$REQUESTS" -eq 2
          test "$ACCEPTS" -eq 1
          test "$DUP_ACKS" -eq 1
          kill -0 "$POS_PID"
          grep -q 'publish sync event' "$POS_LOG"
          grep -q 'sync event published' "$POS_LOG"

          echo "ACK_LOSS_CENTRAL_REQUESTS=$REQUESTS"
          echo "ACK_LOSS_LOGICAL_ACCEPTS=$ACCEPTS"
          echo "ACK_LOSS_DUPLICATE_ACKS=$DUP_ACKS"
          echo "ACK_LOSS_PROCESS_ALIVE=true"
          echo "ACK_LOSS_RUNTIME_PASS=true"
          echo '--- central evidence ---'
          cat "$CENTRAL_LOG"
          echo '--- POS sync evidence ---'
          grep -E 'publish sync event|sync event published|starting POS service' "$POS_LOG" || true
