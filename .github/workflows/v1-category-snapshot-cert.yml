name: V1 Category Snapshot Certification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  category-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Focused live HTTP category snapshot acceptance
        run: go test ./internal/server -run '^TestSaleTimeCategorySnapshotSurvivesCatalogRenameOverLiveHTTP$' -count=1 -v
      - name: Full POSService suite
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build runnable
        run: go build ./cmd/posservice
