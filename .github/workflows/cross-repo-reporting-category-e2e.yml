name: V1 Reporting Category E2E

on:
  pull_request:
    paths:
      - 'internal/database/migrations/0019_order_line_category_snapshots.sql'
      - 'internal/catalog/category_lookup.go'
      - 'internal/orders/orders.go'
      - 'internal/orders/category_snapshot_v1_test.go'
      - 'internal/syncengine/real_reporting_category_e2e_test.go'
      - '.github/workflows/cross-repo-reporting-category-e2e.yml'
  workflow_dispatch:

jobs:
  reporting-category-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGPASSWORD: postgres
      MASTER_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/masterdb
      TENANT_DATABASE_URL_TEMPLATE: postgres://postgres:postgres@127.0.0.1:5432/{db}
      DB_SSL: 'false'
      POS_SYNC_TENANT_ID: tenant-e2e
      POS_SYNC_TOKEN: sync-secret
      POS_E2E_CENTRAL_URL: http://127.0.0.1:5001
      POS_E2E_TENANT_ID: tenant-e2e
      POS_E2E_SYNC_TOKEN: sync-secret
      POS_E2E_DEVICE_ID: device-e2e

    steps:
      - name: Checkout POS Service candidate
        uses: actions/checkout@v4

      - name: Checkout merged Backend main
        uses: actions/checkout@v4
        with:
          repository: HASAN-SHAIK/SHAJRetailProducts-Backend
          ref: main
          path: backend

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create real master and tenant PostgreSQL databases
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE DATABASE masterdb;
          CREATE DATABASE tenant_e2e;
          SQL

          psql -h 127.0.0.1 -U postgres -d masterdb -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE tenants (
            id TEXT PRIMARY KEY,
            shop_name TEXT,
            owner_name TEXT,
            email TEXT,
            mobile TEXT,
            plan_type TEXT,
            is_active BOOLEAN NOT NULL DEFAULT TRUE,
            addons JSONB NOT NULL DEFAULT '{}'::jsonb,
            gst_mode TEXT,
            database_name TEXT NOT NULL
          );
          INSERT INTO tenants(id, shop_name, owner_name, email, mobile, plan_type, is_active, addons, gst_mode, database_name)
          VALUES('tenant-e2e', 'E2E Shop', 'E2E Owner', 'e2e@example.test', '0000000000', 'pro', TRUE, '{}'::jsonb, 'INCLUSIVE', 'tenant_e2e');
          SQL

          psql -h 127.0.0.1 -U postgres -d tenant_e2e -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          CREATE TABLE branches (
            id UUID PRIMARY KEY,
            is_active BOOLEAN NOT NULL DEFAULT TRUE,
            created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
          );
          CREATE TABLE branch_devices (
            id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
            branch_id UUID NOT NULL REFERENCES branches(id),
            device_id TEXT NOT NULL,
            is_active BOOLEAN NOT NULL DEFAULT TRUE,
            created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
          );
          INSERT INTO branches(id, is_active)
          VALUES('11111111-1111-1111-1111-111111111111', TRUE);
          INSERT INTO branch_devices(branch_id, device_id, is_active)
          VALUES('11111111-1111-1111-1111-111111111111', 'device-e2e', TRUE);

          CREATE TABLE products (
            id BIGINT PRIMARY KEY,
            name TEXT,
            category TEXT,
            selling_price NUMERIC(14,2) NOT NULL DEFAULT 0
          );
          INSERT INTO products(id,name,category,selling_price)
          VALUES(101,'Cola now','Snacks',100.00);

          CREATE TABLE orders (
            id BIGSERIAL PRIMARY KEY,
            client_order_id TEXT,
            customer_id BIGINT,
            branch_id UUID,
            location TEXT,
            total_price NUMERIC(14,2) NOT NULL DEFAULT 0,
            total_paid NUMERIC(14,2) NOT NULL DEFAULT 0,
            order_status TEXT NOT NULL DEFAULT 'pending',
            transaction_type TEXT,
            billing_type TEXT,
            created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
            updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
            is_deleted BOOLEAN NOT NULL DEFAULT FALSE
          );
          CREATE TABLE order_items (
            id BIGSERIAL PRIMARY KEY,
            order_id BIGINT NOT NULL,
            product_id BIGINT,
            quantity NUMERIC(14,3) NOT NULL DEFAULT 0,
            selling_price NUMERIC(14,2) NOT NULL DEFAULT 0,
            discount_amount NUMERIC(14,2) NOT NULL DEFAULT 0,
            gst_percent NUMERIC(8,3) NOT NULL DEFAULT 0
          );
          CREATE TABLE order_returns (
            id BIGSERIAL PRIMARY KEY,
            order_id BIGINT NOT NULL
          );
          CREATE TABLE order_return_items (
            id BIGSERIAL PRIMARY KEY,
            return_id BIGINT NOT NULL,
            product_id BIGINT,
            quantity NUMERIC(14,3) NOT NULL DEFAULT 0
          );
          SQL

          psql -h 127.0.0.1 -U postgres -d tenant_e2e -v ON_ERROR_STOP=1 -f backend/Db/migrations/2026-08-07-pos-sync-events.sql
          psql -h 127.0.0.1 -U postgres -d tenant_e2e -v ON_ERROR_STOP=1 -f backend/Db/migrations/2026-08-07-pos-sale-projections.sql
          psql -h 127.0.0.1 -U postgres -d tenant_e2e -v ON_ERROR_STOP=1 -f backend/Db/migrations/2026-08-08-canonical-pos-orders.sql
          psql -h 127.0.0.1 -U postgres -d tenant_e2e -v ON_ERROR_STOP=1 -f backend/Db/migrations/2026-08-08-pos-cashier-audit.sql
          psql -h 127.0.0.1 -U postgres -d tenant_e2e -v ON_ERROR_STOP=1 -f backend/Db/migrations/2026-08-18-pos-sale-tax-snapshots.sql
          psql -h 127.0.0.1 -U postgres -d tenant_e2e -v ON_ERROR_STOP=1 -f backend/Db/migrations/2026-08-18-pos-sale-category-snapshots.sql

      - name: Install backend runtime dependencies
        working-directory: backend
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Start production POS sync route against PostgreSQL
        run: |
          cat > backend/e2e-pos-sync-server.js <<'NODE'
          const express = require('express');
          const router = require('./src/api/v1/modules/sync/posSync.routes');
          const app = express();
          app.use(express.json({ limit: '5mb' }));
          app.use('/api/v1/sync', router);
          app.use((error, req, res, next) => {
            console.error(error);
            res.status(500).json({ code: error.code || 'E2E_SERVER_ERROR', message: error.message });
          });
          const server = app.listen(5001, '127.0.0.1');
          const shutdown = () => server.close(() => process.exit(0));
          process.on('SIGTERM', shutdown);
          process.on('SIGINT', shutdown);
          NODE

          node backend/e2e-pos-sync-server.js >/tmp/pos-reporting-category-e2e.log 2>&1 &
          echo $! >/tmp/pos-reporting-category-e2e.pid

          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:5001/api/v1/sync/events || true)
            if [ "$code" = "401" ]; then exit 0; fi
            sleep 1
          done
          cat /tmp/pos-reporting-category-e2e.log
          exit 1

      - name: Dispatch sale-time category snapshot through restarted POS outbox
        run: CGO_ENABLED=1 go test ./internal/syncengine -run '^TestRealCentralCategorySnapshotE2E$' -count=1 -v

      - name: Verify immutable Central category snapshots
        run: |
          result=$(psql -h 127.0.0.1 -U postgres -d tenant_e2e -At -F '|' -v ON_ERROR_STOP=1 -c "SELECT category_id_snapshot,category_name_snapshot FROM order_items WHERE source_item_id LIKE 'itm_%' LIMIT 1")
          if [ "$result" != "cat-beverages|Beverages" ]; then
            echo "expected sale-time category snapshot cat-beverages|Beverages; got $result"
            exit 1
          fi

      - name: Verify category report ignores current catalog recategorization
        working-directory: backend
        env:
          TENANT_DB_URL: postgres://postgres:postgres@127.0.0.1:5432/tenant_e2e
        run: |
          node <<'NODE'
          const { Pool } = require('pg');
          const { getCategoryPerformance } = require('./src/controllers/tenant/categoryPerformanceV1Controller');
          const pool = new Pool({ connectionString: process.env.TENANT_DB_URL });
          const req = { user: { tenant_id: 'tenant-e2e' }, query: { range: 'last_30_days' }, tenantPool: pool };
          const res = {
            statusCode: 200,
            body: null,
            status(code) { this.statusCode = code; return this; },
            json(body) { this.body = body; return this; },
          };
          (async () => {
            await getCategoryPerformance(req, res);
            if (res.statusCode !== 200 || !res.body?.success) throw new Error(`report failed: ${JSON.stringify(res.body)}`);
            const rows = res.body.data?.category_performance || [];
            const beverage = rows.find((row) => row.category_id === 'cat-beverages');
            if (!beverage || beverage.category_name !== 'Beverages') throw new Error(`sale-time category missing: ${JSON.stringify(rows)}`);
            if (rows.some((row) => row.category_name === 'Snacks')) throw new Error(`current catalog category leaked into history: ${JSON.stringify(rows)}`);
          })().finally(() => pool.end());
          NODE

      - name: Show backend log on failure
        if: failure()
        run: cat /tmp/pos-reporting-category-e2e.log || true

      - name: Stop E2E backend
        if: always()
        run: |
          if [ -f /tmp/pos-reporting-category-e2e.pid ]; then kill "$(cat /tmp/pos-reporting-category-e2e.pid)" || true; fi
