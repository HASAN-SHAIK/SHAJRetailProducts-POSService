name: POS integration

on:
  pull_request:
    branches:
      - agent/15-packaging-and-installer
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Test all POS packages
        run: go test ./...
      - name: Vet POS service
        run: go vet ./...
