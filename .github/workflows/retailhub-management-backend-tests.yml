name: RetailHub management Backend tests

on:
  pull_request:
    paths:
      - 'docs/RETAILHUB_MANAGEMENT_MIGRATION_CERTIFICATION.md'
      - '.github/workflows/retailhub-management-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: HASAN-SHAIK/SHAJRetailProducts-Backend
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test -- --runInBand
