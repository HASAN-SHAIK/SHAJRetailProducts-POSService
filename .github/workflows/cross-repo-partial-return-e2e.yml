name: Cross-repo Partial Return E2E

on:
  pull_request:
    paths:
      - 'internal/refunds/**'
      - 'internal/payments/**'
      - 'internal/inventory/**'
      - 'internal/outbox/**'
      - 'internal/syncengine/**'
      - '.github/workflows/cross-repo-partial-return-e2e.yml'
  workflow_dispatch:

jobs:
  partial-return-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGPASSWORD: postgres
      MASTER_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/masterdb
      TENANT_DATABASE_URL_TEMPLATE: postgres://postgres:postgres@127.0.0.1:5432/{db}
      DB_SSL: 'false'
      POS_SYNC_TENANT_ID: tenant-e2e
      POS_SYNC_TOKEN: sync-secret
      POS_E2E_CENTRAL_URL: http://127.0.0.1:5001
      POS_E2E_TENANT_ID: tenant-e2e
      POS_E2E_SYNC_TOKEN: sync-secret
      POS_E2E_DEVICE_ID: device-e2e

    steps:
      - name: Checkout POS Service
        uses: actions/checkout@v4

      - name: Checkout merged Backend main
        uses: actions/checkout@v4
        with:
          repository: HASAN-SHAIK/SHAJRetailProducts-Backend
          ref: main
          path: backend

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create real master and tenant PostgreSQL databases
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE DATABASE masterdb;
          CREATE DATABASE tenant_e2e;
          SQL

          psql -h 127.0.0.1 -U postgres -d masterdb -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE tenants (
            id TEXT PRIMARY KEY,
            shop_name TEXT,
            owner_name TEXT,
            email TEXT,
            mobile TEXT,
            plan_type TEXT,
            is_active BOOLEAN NOT NULL DEFAULT TRUE,
            addons JSONB NOT NULL DEFAULT '{}'::jsonb,
            gst_mode TEXT,
            database_name TEXT NOT NULL
          );
          INSERT INTO tenants(id, shop_name, owner_name, email, mobile, plan_type, is_active, addons, gst_mode, database_name)
          VALUES('tenant-e2e', 'E2E Shop', 'E2E Owner', 'e2e@example.test', '0000000000', 'pro', TRUE, '{}'::jsonb, 'INCLUSIVE', 'tenant_e2e');
          SQL

          psql -h 127.0.0.1 -U postgres -d tenant_e2e -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE orders (
            id BIGSERIAL PRIMARY KEY,
            client_order_id TEXT,
            customer_id BIGINT,
            total_price NUMERIC(14,2) NOT NULL DEFAULT 0,
            total_paid NUMERIC(14,2) NOT NULL DEFAULT 0,
            order_status TEXT NOT NULL DEFAULT 'pending',
            transaction_type TEXT,
            billing_type TEXT,
            created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
            updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
            is_deleted BOOLEAN NOT NULL DEFAULT FALSE
          );
          CREATE TABLE order_items (
            id BIGSERIAL PRIMARY KEY,
            order_id BIGINT NOT NULL,
            product_id BIGINT,
            quantity NUMERIC(14,3) NOT NULL DEFAULT 0,
            selling_price NUMERIC(14,2) NOT NULL DEFAULT 0,
            discount_amount NUMERIC(14,2) NOT NULL DEFAULT 0,
            gst_percent NUMERIC(8,3) NOT NULL DEFAULT 0
          );
          SQL

          psql -h 127.0.0.1 -U postgres -d tenant_e2e -v ON_ERROR_STOP=1 -f backend/Db/migrations/2026-08-07-pos-sync-events.sql
          psql -h 127.0.0.1 -U postgres -d tenant_e2e -v ON_ERROR_STOP=1 -f backend/Db/migrations/2026-08-07-pos-sale-projections.sql
          psql -h 127.0.0.1 -U postgres -d tenant_e2e -v ON_ERROR_STOP=1 -f backend/Db/migrations/2026-08-07-pos-payment-recorded.sql
          psql -h 127.0.0.1 -U postgres -d tenant_e2e -v ON_ERROR_STOP=1 -f backend/Db/migrations/2026-08-07-pos-inventory-movement-recorded.sql
          psql -h 127.0.0.1 -U postgres -d tenant_e2e -v ON_ERROR_STOP=1 -f backend/Db/migrations/2026-08-08-canonical-pos-orders.sql
          psql -h 127.0.0.1 -U postgres -d tenant_e2e -v ON_ERROR_STOP=1 -f backend/Db/migrations/2026-08-08-pos-cashier-audit.sql
          psql -h 127.0.0.1 -U postgres -d tenant_e2e -v ON_ERROR_STOP=1 -f backend/Db/migrations/2026-08-09-pos-sale-returned.sql
          psql -h 127.0.0.1 -U postgres -d tenant_e2e -v ON_ERROR_STOP=1 -f backend/Db/migrations/2026-08-09-pos-partial-returned.sql

      - name: Install backend runtime dependencies
        working-directory: backend
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Start production POS sync route against PostgreSQL
        run: |
          cat > backend/e2e-pos-sync-server.js <<'NODE'
          const express = require('express');
          const router = require('./src/api/v1/modules/sync/posSync.routes');
          const app = express();
          app.use(express.json({ limit: '5mb' }));
          app.use('/api/v1/sync', router);
          app.use((error, req, res, next) => {
            console.error(error);
            res.status(500).json({ code: error.code || 'E2E_SERVER_ERROR', message: error.message });
          });
          const server = app.listen(5001, '127.0.0.1', () => console.log('POS sync E2E server listening on 5001'));
          const shutdown = () => server.close(() => process.exit(0));
          process.on('SIGTERM', shutdown);
          process.on('SIGINT', shutdown);
          NODE

          node backend/e2e-pos-sync-server.js >/tmp/pos-central-partial-return-e2e.log 2>&1 &
          echo $! >/tmp/pos-central-partial-return-e2e.pid

          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:5001/api/v1/sync/events || true)
            if [ "$code" = "401" ]; then exit 0; fi
            sleep 1
          done
          cat /tmp/pos-central-partial-return-e2e.log
          exit 1

      - name: Partially return sale, sync compensation facts and replay item-level return
        run: CGO_ENABLED=1 go test ./internal/syncengine -run '^TestRealCentralPartialReturnE2E$' -count=1 -v

      - name: Reject tampered replay of a committed refund event identity
        run: |
          event_id=$(psql -h 127.0.0.1 -U postgres -d tenant_e2e -At -v ON_ERROR_STOP=1 -c "SELECT event_id FROM pos_sync_events WHERE event_type='sale.partial_returned' AND aggregate_id='ord-partial-return-cross-repo-e2e' LIMIT 1")
          if [ -z "$event_id" ]; then
            echo "missing committed partial-return event"
            exit 1
          fi

          cat > /tmp/tampered-partial-return.json <<JSON
          {
            "event_id": "$event_id",
            "event_type": "sale.partial_returned",
            "schema_version": 1,
            "aggregate_type": "sales_order",
            "aggregate_id": "ord-partial-return-cross-repo-e2e",
            "aggregate_version": 3,
            "ordering_key": "sales_order:ord-partial-return-cross-repo-e2e",
            "payload": {"tampered": true, "refund_minor": 999999},
            "metadata": {"source": "pos_service"},
            "created_at": "2026-08-10T00:00:00Z"
          }
          JSON

          http_code=$(curl -sS -o /tmp/tampered-partial-return-response.json -w '%{http_code}' \
            -X POST http://127.0.0.1:5001/api/v1/sync/events \
            -H 'Content-Type: application/json' \
            -H 'X-POS-Tenant-ID: tenant-e2e' \
            -H 'X-POS-Device-ID: device-e2e' \
            -H 'X-POS-Sync-Token: sync-secret' \
            -H "Idempotency-Key: $event_id" \
            --data-binary @/tmp/tampered-partial-return.json)

          if [ "$http_code" != "409" ]; then
            echo "tampered replay expected HTTP 409, got $http_code"
            cat /tmp/tampered-partial-return-response.json
            exit 1
          fi
          node -e "const fs=require('fs'); const body=JSON.parse(fs.readFileSync('/tmp/tampered-partial-return-response.json','utf8')); if(body.code!=='SYNC_EVENT_ID_COLLISION'||body.event_id!==process.argv[1]) { console.error(body); process.exit(1); }" "$event_id"

      - name: Verify partial-return convergence and exactly-once replay
        run: |
          assert_one() {
            local sql="$1"
            local label="$2"
            local count
            count=$(psql -h 127.0.0.1 -U postgres -d tenant_e2e -At -v ON_ERROR_STOP=1 -c "$sql")
            if [ "$count" != "1" ]; then
              echo "$label expected exactly 1 row, got $count"
              exit 1
            fi
          }

          assert_one "SELECT COUNT(*) FROM pos_sync_events WHERE event_type='sale.completed' AND aggregate_id='ord-partial-return-cross-repo-e2e' AND processed_at IS NOT NULL" "sale.completed event"
          assert_one "SELECT COUNT(*) FROM pos_sync_events WHERE event_type='sale.partial_returned' AND aggregate_id='ord-partial-return-cross-repo-e2e' AND processed_at IS NOT NULL" "sale.partial_returned event"
          assert_one "SELECT COUNT(*) FROM pos_sync_events WHERE event_type='payment.recorded' AND processed_at IS NOT NULL AND payload_json->'payment'->>'order_id'='ord-partial-return-cross-repo-e2e' AND payload_json->'payment'->>'direction'='out'" "partial refund payment event"
          assert_one "SELECT COUNT(*) FROM pos_sync_events WHERE event_type='inventory.movement.recorded' AND processed_at IS NOT NULL AND payload_json->'movement'->>'reference_id'='ord-partial-return-cross-repo-e2e' AND payload_json->'movement'->>'movement_type'='sale_return'" "partial return inventory event"
          assert_one "SELECT COUNT(*) FROM pos_partial_returns WHERE return_id='ret-partial-cross-repo-e2e' AND source_order_id='ord-partial-return-cross-repo-e2e' AND refund_minor=2500 AND approved_by_user_id='manager-partial-return-e2e' AND reason='customer returned one quarter'" "central partial-return operation"
          assert_one "SELECT COUNT(*) FROM pos_partial_return_items WHERE return_id='ret-partial-cross-repo-e2e' AND source_item_id='item-partial-return-cross-repo-e2e' AND quantity_milli=250 AND refund_minor=2500" "central partial-return item"
          assert_one "SELECT COUNT(*) FROM orders o JOIN pos_partial_returns r ON r.order_id=o.id WHERE o.source_channel='pos' AND o.source_order_id='ord-partial-return-cross-repo-e2e' AND o.total_paid=75 AND o.source_version=r.source_version AND r.return_id='ret-partial-cross-repo-e2e'" "canonical partially refunded order and source-version convergence"
          assert_one "SELECT COUNT(*) FROM order_items oi JOIN orders o ON o.id=oi.order_id WHERE o.source_channel='pos' AND o.source_order_id='ord-partial-return-cross-repo-e2e' AND oi.source_item_id='item-partial-return-cross-repo-e2e' AND oi.source_returned_quantity_milli=250 AND oi.source_refunded_minor=2500" "canonical returned item totals"
          assert_one "SELECT COUNT(*) FROM pos_sale_payments WHERE order_id='ord-partial-return-cross-repo-e2e' AND direction='out' AND status='refunded' AND amount_minor=2500" "central proportional payment reversal"
          assert_one "SELECT COUNT(*) FROM pos_inventory_movements WHERE order_id='ord-partial-return-cross-repo-e2e' AND movement_type='sale_return' AND quantity_delta_milli=250" "central partial inventory restoration"

      - name: Show backend log on failure
        if: failure()
        run: cat /tmp/pos-central-partial-return-e2e.log || true

      - name: Stop E2E backend
        if: always()
        run: |
          if [ -f /tmp/pos-central-partial-return-e2e.pid ]; then kill "$(cat /tmp/pos-central-partial-return-e2e.pid)" || true; fi
