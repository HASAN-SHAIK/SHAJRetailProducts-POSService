name: V1 pricing refund parity

on:
  pull_request:
    paths:
      - 'internal/refunds/**'
      - 'internal/payments/**'
      - '.github/workflows/v1-pricing-refund-parity.yml'
  workflow_dispatch:

jobs:
  pricing-refund-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Certify full and partial refund pricing parity
        run: |
          CGO_ENABLED=1 go test ./internal/payments -run '^TestV1FullRefundReversesImmutableTaxedDiscountedSaleTotal$' -count=1 -v
          CGO_ENABLED=1 go test ./internal/refunds -run '^TestV1PartialReturnsPreserveImmutableTaxedDiscountedLineTotal$' -count=1 -v
