name: Cross-repo Customer E2E

on:
  pull_request:
    paths:
      - 'internal/customer/**'
      - 'internal/inbox/**'
      - 'internal/changefeed/real_customer_central_e2e_test.go'
      - 'internal/syncengine/real_customer_central_e2e_test.go'
      - 'docs/V1_CUSTOMERS_ACCEPTANCE_MATRIX.md'
      - '.github/workflows/cross-repo-customer-e2e.yml'
  workflow_dispatch:

jobs:
  customer-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGPASSWORD: postgres
      MASTER_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/masterdb
      TENANT_DATABASE_URL_TEMPLATE: postgres://postgres:postgres@127.0.0.1:5432/{db}
      DB_SSL: 'false'
      POS_SYNC_TENANT_ID: tenant-e2e
      POS_SYNC_TOKEN: sync-secret
      POS_E2E_CENTRAL_URL: http://127.0.0.1:5001
      POS_E2E_TENANT_ID: tenant-e2e
      POS_E2E_SYNC_TOKEN: sync-secret
      POS_E2E_DEVICE_ID: device-e2e
      POS_E2E_CUSTOMER_ID_FILE: /tmp/pos-customer-id

    steps:
      - name: Checkout POS Service
        uses: actions/checkout@v4

      - name: Checkout merged Backend main
        uses: actions/checkout@v4
        with:
          repository: HASAN-SHAIK/SHAJRetailProducts-Backend
          ref: main
          path: backend

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create real master and tenant PostgreSQL databases
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE DATABASE masterdb;
          CREATE DATABASE tenant_e2e;
          SQL

          psql -h 127.0.0.1 -U postgres -d masterdb -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE tenants (
            id TEXT PRIMARY KEY,
            shop_name TEXT,
            owner_name TEXT,
            email TEXT,
            mobile TEXT,
            plan_type TEXT,
            is_active BOOLEAN NOT NULL DEFAULT TRUE,
            addons JSONB NOT NULL DEFAULT '{}'::jsonb,
            gst_mode TEXT,
            database_name TEXT NOT NULL
          );
          INSERT INTO tenants(id,shop_name,owner_name,email,mobile,plan_type,is_active,addons,gst_mode,database_name)
          VALUES('tenant-e2e','E2E Shop','E2E Owner','e2e@example.test','0000000000','pro',TRUE,'{}'::jsonb,'INCLUSIVE','tenant_e2e');
          SQL

          psql -h 127.0.0.1 -U postgres -d tenant_e2e -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE customers (
            id BIGSERIAL PRIMARY KEY,
            name TEXT,
            mobile TEXT,
            phone TEXT,
            type TEXT DEFAULT 'retail',
            email TEXT,
            shop_name TEXT,
            gst_number TEXT,
            credit_limit NUMERIC NOT NULL DEFAULT 0,
            current_balance NUMERIC NOT NULL DEFAULT 0,
            notes TEXT,
            is_active BOOLEAN NOT NULL DEFAULT TRUE,
            location TEXT,
            address TEXT,
            created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
            updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
          );
          CREATE TABLE products (
            id BIGINT PRIMARY KEY,
            name TEXT NOT NULL,
            barcode TEXT,
            selling_price NUMERIC(14,2),
            category TEXT,
            stock_quantity NUMERIC(14,3) NOT NULL DEFAULT 0,
            branch_id UUID,
            hsn_code VARCHAR(20),
            gst_percentage NUMERIC(5,2),
            is_deleted BOOLEAN NOT NULL DEFAULT FALSE,
            created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
            updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
          );
          CREATE TABLE branch_devices (
            id UUID PRIMARY KEY,
            device_id TEXT NOT NULL,
            branch_id UUID NOT NULL,
            is_active BOOLEAN NOT NULL DEFAULT TRUE,
            created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
          );
          INSERT INTO branch_devices(id,device_id,branch_id,is_active,created_at)
          VALUES('aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa','device-e2e','11111111-1111-1111-1111-111111111111',TRUE,NOW());

          CREATE TABLE orders (
            id BIGSERIAL PRIMARY KEY,
            client_order_id TEXT,
            customer_id BIGINT REFERENCES customers(id),
            total_price NUMERIC(14,2) NOT NULL DEFAULT 0,
            total_paid NUMERIC(14,2) NOT NULL DEFAULT 0,
            order_status TEXT NOT NULL DEFAULT 'pending',
            transaction_type TEXT,
            billing_type TEXT,
            created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
            updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
            is_deleted BOOLEAN NOT NULL DEFAULT FALSE
          );
          CREATE TABLE order_items (
            id BIGSERIAL PRIMARY KEY,
            order_id BIGINT NOT NULL,
            product_id BIGINT,
            quantity NUMERIC(14,3) NOT NULL DEFAULT 0,
            selling_price NUMERIC(14,2) NOT NULL DEFAULT 0,
            discount_amount NUMERIC(14,2) NOT NULL DEFAULT 0,
            gst_percent NUMERIC(8,3) NOT NULL DEFAULT 0
          );
          SQL

          psql -h 127.0.0.1 -U postgres -d tenant_e2e -v ON_ERROR_STOP=1 -f backend/Db/migrations/2026-08-07-pos-sync-events.sql
          psql -h 127.0.0.1 -U postgres -d tenant_e2e -v ON_ERROR_STOP=1 -f backend/Db/migrations/2026-08-07-pos-sale-projections.sql
          psql -h 127.0.0.1 -U postgres -d tenant_e2e -v ON_ERROR_STOP=1 -f backend/Db/migrations/2026-08-07-pos-customer-changed.sql
          psql -h 127.0.0.1 -U postgres -d tenant_e2e -v ON_ERROR_STOP=1 -f backend/Db/migrations/2026-08-08-canonical-pos-orders.sql
          psql -h 127.0.0.1 -U postgres -d tenant_e2e -v ON_ERROR_STOP=1 -f backend/Db/migrations/2026-08-08-pos-cashier-audit.sql
          psql -h 127.0.0.1 -U postgres -d tenant_e2e -v ON_ERROR_STOP=1 -f backend/Db/migrations/2026-08-15-pos-customer-canonical-mapping.sql

          psql -h 127.0.0.1 -U postgres -d tenant_e2e -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO customers(id,name,mobile,phone,type,email,gst_number,credit_limit,current_balance,is_active,created_at,updated_at)
          VALUES(42,'Central Reconciled Customer','8111111111','8111111111','retail','central-reconciled@example.test','GST-CENTRAL-RECONCILED',123.45,67.89,FALSE,NOW(),NOW());
          INSERT INTO pos_customer_mappings(pos_customer_id,canonical_customer_id,source_event_id,source_version)
          VALUES('cus-central-reconcile-e2e',42,'seed-central-reconcile',1);
          SQL

      - name: Install backend runtime dependencies
        working-directory: backend
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Start production POS sync route against PostgreSQL
        run: |
          cat > backend/e2e-pos-sync-server.js <<'NODE'
          const express = require('express');
          const router = require('./src/api/v1/modules/sync/posSync.routes');
          const app = express();
          app.use(express.json({ limit: '5mb' }));
          app.use('/api/v1/sync', router);
          app.use((error, req, res, next) => {
            console.error(error);
            res.status(500).json({ code: error.code || 'E2E_SERVER_ERROR', message: error.message });
          });
          const server = app.listen(5001, '127.0.0.1');
          const shutdown = () => server.close(() => process.exit(0));
          process.on('SIGTERM', shutdown);
          process.on('SIGINT', shutdown);
          NODE
          node backend/e2e-pos-sync-server.js >/tmp/customer-central-e2e.log 2>&1 &
          echo $! >/tmp/customer-central-e2e.pid
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:5001/api/v1/sync/events || true)
            if [ "$code" = "401" ]; then exit 0; fi
            sleep 1
          done
          cat /tmp/customer-central-e2e.log
          exit 1

      - name: Create offline customer, restart, replay and sync linked sale
        run: CGO_ENABLED=1 go test ./internal/syncengine -run '^TestRealCentralCustomerCanonicalConvergenceE2E$' -count=1 -v

      - name: Verify canonical identity mapping, Central financial authority and sale association
        run: |
          pos_customer_id=$(cat "$POS_E2E_CUSTOMER_ID_FILE")
          canonical_id=$(psql -h 127.0.0.1 -U postgres -d tenant_e2e -At -v ON_ERROR_STOP=1 -c "SELECT canonical_customer_id FROM pos_customer_mappings WHERE pos_customer_id='${pos_customer_id}'")
          if [ -z "$canonical_id" ]; then echo 'missing canonical customer mapping'; exit 1; fi

          assert_one() {
            count=$(psql -h 127.0.0.1 -U postgres -d tenant_e2e -At -v ON_ERROR_STOP=1 -c "$1")
            if [ "$count" != "1" ]; then echo "$2 expected exactly 1 row, got $count"; exit 1; fi
          }
          assert_one "SELECT COUNT(*) FROM pos_customer_mappings WHERE pos_customer_id='${pos_customer_id}'" "immutable mapping"
          assert_one "SELECT COUNT(*) FROM customers WHERE id=${canonical_id} AND name='Offline Customer E2E' AND regexp_replace(COALESCE(phone,mobile,''),'\\D','','g')='9000000000' AND credit_limit=0 AND current_balance=0" "canonical customer with Central-owned financials"
          assert_one "SELECT COUNT(*) FROM pos_customers WHERE customer_id='${pos_customer_id}' AND credit_limit_minor=990000" "POS compatibility financial snapshot"
          assert_one "SELECT COUNT(*) FROM orders WHERE source_channel='pos' AND source_order_id='ord-customer-link-e2e' AND source_customer_id='${pos_customer_id}' AND customer_id=${canonical_id}" "canonical customer-linked sale"
          assert_one "SELECT COUNT(*) FROM pos_sync_events WHERE event_id='evt_customer_${pos_customer_id}_v1' AND processed_at IS NOT NULL" "customer event replay"

      - name: Reconcile Central customer lifecycle and financial snapshots back into POS
        run: CGO_ENABLED=1 go test ./internal/changefeed -run '^TestRealCentralCustomerReconciliationE2E$' -count=1 -v

      - name: Show backend log on failure
        if: failure()
        run: cat /tmp/customer-central-e2e.log || true

      - name: Stop E2E backend
        if: always()
        run: |
          if [ -f /tmp/customer-central-e2e.pid ]; then kill "$(cat /tmp/customer-central-e2e.pid)" || true; fi
