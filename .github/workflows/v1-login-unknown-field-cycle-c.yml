name: V1 Login Unknown Field Cycle C

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact head
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          echo "EXACT_HEAD=$(git rev-parse HEAD)"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Focused runtime harness syntax
        run: bash -n tests/v1-login-unknown-field-runtime.sh

      - name: Focused unknown-field login test
        run: go test ./internal/server -run '^TestLocalAuthLoginRejectsUnknownJSONField$' -count=1 -v

      - name: Relevant complete Go suite
        run: go test ./...

      - name: Go vet
        run: go vet ./...

      - name: Build runnable POSService
        run: go build -o /tmp/posservice-cycle-c ./cmd/posservice

      - name: Real unknown-field login application runtime
        run: bash tests/v1-login-unknown-field-runtime.sh /tmp/posservice-cycle-c
