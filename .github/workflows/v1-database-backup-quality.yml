name: V1 POS backup restore acceptance

on:
  pull_request:
    paths:
      - 'internal/backup/**'
      - 'internal/database/**'
      - '.github/workflows/v1-database-backup-quality.yml'
      - 'docs/RECOVERY.md'
      - 'docs/V1_DATABASE_MIGRATION_RECOVERY_ACCEPTANCE_MATRIX.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Run V1 SQLite backup restore acceptance
        run: go test ./internal/backup -run '^TestV1' -count=1
      - name: Build packaged POS runtime
        run: go build ./cmd/posservice
