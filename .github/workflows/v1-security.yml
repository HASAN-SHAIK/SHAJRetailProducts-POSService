name: V1 Security acceptance

on:
  pull_request:
    paths:
      - 'internal/config/config.go'
      - 'internal/config/config_test.go'
      - 'internal/security/**'
      - '.env.example'
      - '.github/workflows/v1-security.yml'
      - 'docs/V1_SECURITY_ACCEPTANCE_MATRIX.md'
  workflow_dispatch:

jobs:
  security-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Run V1 POS security acceptance
        run: go test ./internal/config ./internal/security
      - name: Build packaged POS runtime
        run: go build ./cmd/posservice
