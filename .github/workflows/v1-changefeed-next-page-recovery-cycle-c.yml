name: V1 Changefeed Next Page Recovery Cycle C

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact head
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          echo "EXACT_HEAD=$(git rev-parse HEAD)"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Focused next-page recovery regression
        run: go test ./internal/changefeed -run '^TestCycleCChangeFeedResumesAfterLaterPage503$' -count=1 -v

      - name: Relevant complete Go suite
        run: go test ./...

      - name: Vet and build runnable
        run: |
          go vet ./...
          go build -o /tmp/posservice-cycle-c ./cmd/posservice

      - name: Real POSService later-page 503 recovery runtime
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/cycle-c-next-page-recovery"
          mkdir -p "$ROOT/state" "$ROOT/backups"
          DB="$ROOT/state/pos.db"
          REQLOG="$ROOT/central.log"
          POSLOG="$ROOT/pos.log"
          cat > "$ROOT/central.py" <<'PY'
          import json, sys
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from urllib.parse import urlparse, parse_qs
          log=sys.argv[1]; n=0
          def page(cursor, more, pid, name):
              return {"cursor":cursor,"has_more":more,"changes":[] if not pid else [{"id":"product:"+pid+":v1","type":"catalog.product.upsert","schema_version":1,"source":"central","payload":{"id":pid,"name":name,"is_active":True,"allow_manual_price":False,"track_inventory":True,"version":1}}]}
          class H(BaseHTTPRequestHandler):
              def log_message(self,*a): pass
              def write(self,status,obj):
                  b=json.dumps(obj).encode(); self.send_response(status); self.send_header('Content-Type','application/json'); self.send_header('Content-Length',str(len(b))); self.end_headers(); self.wfile.write(b)
              def do_GET(self):
                  global n
                  u=urlparse(self.path)
                  if u.path=='/health': self.write(200,{"ok":True}); return
                  if u.path!='/api/v1/sync/changes': self.write(200,{}); return
                  n+=1; c=parse_qs(u.query).get('cursor',[''])[0]
                  with open(log,'a') as f: f.write(f"{n}|{c}|{self.headers.get('X-POS-Device-ID','')}|{self.headers.get('X-POS-Tenant-ID','')}\n")
                  if n==1: self.write(200,page('cursor-page-1',True,'recovery-first','Recovery First')); return
                  if n==2: self.write(503,{"error":"temporary"}); return
                  if n==3: self.write(200,page('cursor-page-2',False,'recovery-second','Recovery Second')); return
                  self.write(200,page('cursor-page-2',False,'',''))
              def do_POST(self):
                  l=int(self.headers.get('Content-Length','0')); self.rfile.read(l) if l else None; self.write(200,{"accepted":True})
          ThreadingHTTPServer(('127.0.0.1',18083),H).serve_forever()
          PY
          python3 "$ROOT/central.py" "$REQLOG" & CENTRAL_PID=$!
          POS_PID=""
          cleanup(){ [ -z "${POS_PID:-}" ] || kill "$POS_PID" 2>/dev/null || true; kill "$CENTRAL_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for _ in $(seq 1 50); do curl -fsS http://127.0.0.1:18083/health >/dev/null 2>&1 && break; sleep .1; done
          export POS_ENVIRONMENT=test
          export POS_LISTEN_ADDRESS=127.0.0.1:4825
          export POS_SQLITE_PATH="$DB"
          export POS_LOCAL_API_TOKEN=cycle-c-local-token-0123456789abcdef0123456789
          export POS_LOCAL_TOKEN_FILE="$ROOT/local.token"
          export POS_DEVICE_ID=dev-recovery
          export POS_INSTALLATION_ID=install-recovery
          export POS_CENTRAL_API_URL=http://127.0.0.1:18083
          export POS_SYNC_TENANT_ID=tenant-recovery
          export POS_SYNC_TOKEN=secret-recovery
          export POS_SYNC_INTERVAL=1s
          export POS_SYNC_REQUEST_TIMEOUT=2s
          export POS_BACKUP_DIRECTORY="$ROOT/backups"
          export POS_BACKUP_INTERVAL=1h
          export POS_OBSERVABILITY_INTERVAL=1h
          /tmp/posservice-cycle-c >"$POSLOG" 2>&1 & POS_PID=$!
          for _ in $(seq 1 80); do curl -fsS http://127.0.0.1:4825/api/v1/health >/dev/null 2>&1 && break; kill -0 "$POS_PID" 2>/dev/null || { cat "$POSLOG"; exit 1; }; sleep .1; done
          curl -fsS http://127.0.0.1:4825/api/v1/health >/dev/null
          python3 - "$DB" "$REQLOG" <<'PY'
          import sqlite3,sys,time,os
          db,log=sys.argv[1:]; deadline=time.time()+8
          final=None; a=p=0
          while time.time()<deadline:
              try:
                  c=sqlite3.connect(db); q=c.cursor()
                  r=q.execute("SELECT cursor_value FROM sync_checkpoints WHERE stream_name='central_changes'").fetchone(); final=r[0] if r else None
                  a=q.execute("SELECT COUNT(*) FROM inbox_messages WHERE message_id IN ('product:recovery-first:v1','product:recovery-second:v1') AND status='applied'").fetchone()[0]
                  p=q.execute("SELECT COUNT(*) FROM catalog_products WHERE id IN ('recovery-first','recovery-second')").fetchone()[0]; c.close()
                  if final=='cursor-page-2' and a==2 and p==2: break
              except sqlite3.Error: pass
              time.sleep(.1)
          else: raise SystemExit(f'no convergence final={final} applied={a} products={p}')
          lines=open(log).read().splitlines() if os.path.exists(log) else []
          print('CHANGEFEED_RECOVERY_REQUESTS='+str(lines[:3]))
          print('CHANGEFEED_RECOVERY_FINAL_CURSOR='+str(final))
          print('CHANGEFEED_RECOVERY_APPLIED='+str(a))
          print('CHANGEFEED_RECOVERY_PRODUCTS='+str(p))
          if len(lines)<3: raise SystemExit('fewer than 3 changefeed requests')
          parts=[x.split('|') for x in lines[:3]]
          if [x[1] for x in parts] != ['', 'cursor-page-1', 'cursor-page-1']: raise SystemExit('cursor sequence mismatch '+str(parts))
          if any(x[2] != 'dev-recovery' or x[3] != 'tenant-recovery' for x in parts): raise SystemExit('machine headers mismatch')
          PY
          kill -0 "$POS_PID"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4825/api/v1/health)" = 200
          echo 'CHANGEFEED_NEXT_PAGE_RECOVERY_RUNTIME_PASS=true'

      - name: Certification result
        run: echo 'CHANGEFEED_NEXT_PAGE_RECOVERY_CERTIFICATION=PASS'
