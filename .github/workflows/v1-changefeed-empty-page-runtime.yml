name: V1 empty change-feed page runtime certification

on:
  pull_request:
    branches: [main]
    paths:
      - 'internal/**'
      - 'cmd/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/v1-changefeed-empty-page-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR merge
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Focused empty-page acceptance
        run: go test ./internal/changefeed -run '^TestPullUntilCaughtUpAdvancesCursorAcrossEmptyPage$' -count=1 -v

      - name: Full POS suite
        run: go test ./...

      - name: Vet and build runnable
        run: |
          go vet ./...
          go build -o "$RUNNER_TEMP/posservice" ./cmd/posservice

      - name: Real POSService empty-page runtime probe
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/v1-empty-changefeed"
          mkdir -p "$ROOT"
          DB="$ROOT/pos.db"
          MOCK_LOG="$ROOT/mock.log"
          POS_LOG="$ROOT/pos.log"

          cat > "$ROOT/mock_central.py" <<'PY'
          import json, sys
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from urllib.parse import urlparse, parse_qs

          log_path = sys.argv[1]
          request_count = 0

          class Handler(BaseHTTPRequestHandler):
              def log_message(self, fmt, *args):
                  pass
              def _write(self, status, payload):
                  body = json.dumps(payload).encode()
                  self.send_response(status)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def do_GET(self):
                  global request_count
                  parsed = urlparse(self.path)
                  if parsed.path == "/health":
                      self._write(200, {"ok": True})
                      return
                  if parsed.path != "/api/v1/sync/changes":
                      self._write(200, {})
                      return
                  request_count += 1
                  query = parse_qs(parsed.query)
                  cursor = query.get("cursor", [""])[0]
                  with open(log_path, "a", encoding="utf-8") as f:
                      f.write("REQ=%d cursor=%s limit=%s device=%s tenant=%s token=%s\n" % (
                          request_count,
                          cursor,
                          query.get("limit", [""])[0],
                          self.headers.get("X-POS-Device-ID", ""),
                          self.headers.get("X-POS-Tenant-ID", ""),
                          self.headers.get("X-POS-Sync-Token", ""),
                      ))
                  if request_count == 1:
                      self._write(200, {"cursor": "cursor-empty-page", "has_more": True, "changes": []})
                      return
                  if request_count == 2:
                      self._write(200, {
                          "cursor": "cursor-after-empty",
                          "has_more": False,
                          "changes": [{
                              "id": "product:after-empty:v1",
                              "type": "catalog.product.upsert",
                              "schema_version": 1,
                              "source": "central",
                              "payload": {
                                  "id": "after-empty",
                                  "name": "After Empty Page",
                                  "is_active": True,
                                  "allow_manual_price": False,
                                  "track_inventory": True,
                                  "version": 1
                              }
                          }]
                      })
                      return
                  self._write(500, {"error": "unexpected extra change-feed request"})
              def do_POST(self):
                  length = int(self.headers.get("Content-Length", "0"))
                  if length:
                      self.rfile.read(length)
                  self._write(200, {"accepted": True})

          ThreadingHTTPServer(("127.0.0.1", 18081), Handler).serve_forever()
          PY

          python3 "$ROOT/mock_central.py" "$MOCK_LOG" &
          MOCK_PID=$!
          POS_PID=""
          cleanup() {
            if [ -n "${POS_PID:-}" ]; then kill "$POS_PID" 2>/dev/null || true; fi
            if [ -n "${MOCK_PID:-}" ]; then kill "$MOCK_PID" 2>/dev/null || true; fi
          }
          trap cleanup EXIT

          for _ in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:18081/health >/dev/null 2>&1; then break; fi
            if ! kill -0 "$MOCK_PID" 2>/dev/null; then exit 1; fi
            sleep 0.1
          done
          curl -fsS http://127.0.0.1:18081/health >/dev/null

          export POS_ENVIRONMENT=test
          export POS_LISTEN_ADDRESS=127.0.0.1:4788
          export POS_SQLITE_PATH="$DB"
          export POS_LOCAL_API_TOKEN=local-runtime-token-0123456789abcdef
          export POS_LOCAL_TOKEN_FILE="$ROOT/local.token"
          export POS_DEVICE_ID=dev-empty
          export POS_INSTALLATION_ID=install-empty
          export POS_CENTRAL_API_URL=http://127.0.0.1:18081
          export POS_SYNC_TENANT_ID=tenant-empty
          export POS_SYNC_TOKEN=secret-empty
          export POS_SYNC_INTERVAL=30s
          export POS_SYNC_REQUEST_TIMEOUT=2s
          export POS_BACKUP_DIRECTORY="$ROOT/backups"
          export POS_BACKUP_INTERVAL=1h
          export POS_OBSERVABILITY_INTERVAL=1h

          "$RUNNER_TEMP/posservice" >"$POS_LOG" 2>&1 &
          POS_PID=$!

          for _ in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:4788/api/v1/health >/dev/null 2>&1; then break; fi
            if ! kill -0 "$POS_PID" 2>/dev/null; then cat "$POS_LOG"; exit 1; fi
            sleep 0.1
          done
          curl -fsS http://127.0.0.1:4788/api/v1/health >/dev/null

          python3 - "$DB" "$MOCK_LOG" <<'PY'
          import os, sqlite3, sys, time
          db_path, log_path = sys.argv[1], sys.argv[2]
          deadline = time.time() + 8
          cursor = None
          applied = products = 0
          while time.time() < deadline:
              try:
                  con = sqlite3.connect(db_path)
                  cur = con.cursor()
                  cursor = cur.execute("SELECT cursor_value FROM sync_checkpoints WHERE stream_name='central_changes'").fetchone()
                  applied = cur.execute("SELECT COUNT(*) FROM inbox_messages WHERE message_id='product:after-empty:v1' AND status='applied'").fetchone()[0]
                  products = cur.execute("SELECT COUNT(*) FROM catalog_products WHERE id='after-empty' AND name='After Empty Page' AND is_active=1").fetchone()[0]
                  checkpoints = cur.execute("SELECT COUNT(*) FROM sync_checkpoints WHERE stream_name='central_changes' AND cursor_value='cursor-after-empty'").fetchone()[0]
                  con.close()
                  if cursor and cursor[0] == 'cursor-after-empty' and applied == 1 and products == 1 and checkpoints == 1:
                      break
              except sqlite3.Error:
                  pass
              time.sleep(0.1)
          else:
              print(open(log_path, encoding='utf-8').read() if os.path.exists(log_path) else 'NO_MOCK_LOG')
              raise SystemExit('runtime state did not converge after empty page')

          lines = open(log_path, encoding='utf-8').read().splitlines()
          print('RUNTIME_CHANGE_REQUEST_COUNT=' + str(len(lines)))
          print('RUNTIME_FINAL_CURSOR=' + cursor[0])
          print('RUNTIME_APPLIED_INBOX=' + str(applied))
          print('RUNTIME_PRODUCT_ROWS=' + str(products))
          for line in lines:
              print('RUNTIME_' + line)
          if len(lines) != 2:
              raise SystemExit(f'expected exactly 2 initial catch-up requests, got {len(lines)}')
          if 'REQ=1 cursor= limit=100 device=dev-empty tenant=tenant-empty token=secret-empty' not in lines[0]:
              raise SystemExit('first request contract mismatch: ' + lines[0])
          if 'REQ=2 cursor=cursor-empty-page limit=100 device=dev-empty tenant=tenant-empty token=secret-empty' not in lines[1]:
              raise SystemExit('second request did not advance through empty-page cursor: ' + lines[1])
          PY

          kill "$POS_PID"
          wait "$POS_PID" || true
          POS_PID=""
          grep -q 'starting POS service' "$POS_LOG"
          grep -q 'local device identity ready' "$POS_LOG"
          echo 'REAL_POS_SERVICE_EMPTY_PAGE_RUNTIME=PASS'

      - name: Record exact-head evidence
        if: always()
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "GITHUB_HEAD_REF=$GITHUB_HEAD_REF"
          echo "GITHUB_BASE_REF=$GITHUB_BASE_REF"
