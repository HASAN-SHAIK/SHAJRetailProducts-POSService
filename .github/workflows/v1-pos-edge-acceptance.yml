name: V1 POS edge acceptance

on:
  pull_request:
    paths:
      - 'internal/**'
      - 'docs/V1-TRANSACTION-ACCEPTANCE-MATRIX.md'
      - '.github/workflows/v1-pos-edge-acceptance.yml'
  workflow_dispatch:

jobs:
  edge-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout POS Service
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Certify V1 void and refund restart lifecycle
        run: |
          CGO_ENABLED=1 go test ./internal/server \
            -run '^(TestManagerApprovedVoidConsumesApprovalAndSurvivesRestart|TestManagerApprovedRefundConsumesApprovalAndSurvivesRestart|TestPartialRefundOrderScopedApprovalLifecycleAcrossRestart|TestRefundManagerApprovalAPIStoresExactCentralAuthorizedScope)$' \
            -count=1 -v

      - name: Certify V1 manager approval is single-use under concurrency
        run: |
          CGO_ENABLED=1 go test ./internal/server \
            -run '^TestManagerApprovalConcurrentConsumeSucceedsExactlyOnce$' \
            -count=1 -v

      - name: Certify V1 manager-approved void restart and concurrency boundary
        run: |
          CGO_ENABLED=1 go test ./internal/server \
            -run '^(TestManagerApprovedVoidConsumesApprovalAndSurvivesRestart|TestManagerApprovalConcurrentConsumeSucceedsExactlyOnce)$' \
            -count=1 -v

      - name: Certify V1 pre-completion void remains POS-local across restart
        run: |
          CGO_ENABLED=1 go test ./internal/server \
            -run '^TestManagerApprovedVoidConsumesApprovalAndSurvivesRestart$' \
            -count=1 -v

      - name: Certify V1 rejected void replay has no side effects
        run: |
          CGO_ENABLED=1 go test ./internal/server \
            -run '^TestManagerApprovedVoidConsumesApprovalAndSurvivesRestart$' \
            -count=1 -v

      - name: Certify V1 wrong-order void scope survives restart without side effects
        run: |
          CGO_ENABLED=1 go test ./internal/server \
            -run '^TestVoidApprovalWrongOrderSurvivesRestartWithoutSideEffects$' \
            -count=1 -v

      - name: Certify V1 legacy sensitive approvals fail closed across restart
        run: |
          CGO_ENABLED=1 go test ./internal/server \
            -run '^TestLegacySensitiveApprovalWithoutReasonRemainsUnconsumedAcrossRestart$' \
            -count=1 -v

      - name: Certify V1 Central-authorized recovery across restart
        run: |
          CGO_ENABLED=1 go test ./internal/server \
            -run '^TestCentralAuthorizedRecoverySurvivesRestartAndPreservesOrderHead$' \
            -count=1 -v

      - name: Certify V1 lost-ack retry across POS restart
        run: |
          CGO_ENABLED=1 go test ./internal/syncengine \
            -run '^TestRefundEventRecoversWhenCentralAcceptsButAcknowledgementIsLost$' \
            -count=1 -v

      - name: Certify V1 lost-ack restart and same-order refund ordering
        run: |
          CGO_ENABLED=1 go test ./internal/syncengine \
            -run '^TestV1RefundSyncLostAckRestartAndOrderingAcceptance$' \
            -count=1 -v

      - name: Certify V1 operator-visible refund reconciliation state
        run: |
          CGO_ENABLED=1 go test ./internal/refunds \
            -run '^TestGetReconciliationSnapshotIncludesRefundSyncState$' \
            -count=1 -v

      - name: Certify V1 cashier refund through restart, sync, recovery, and reconciliation
        run: |
          CGO_ENABLED=1 go test ./internal/server ./internal/syncengine ./internal/refunds \
            -run '^(TestManagerApprovedRefundConsumesApprovalAndSurvivesRestart|TestPartialRefundOrderScopedApprovalLifecycleAcrossRestart|TestCentralAuthorizedRecoverySurvivesRestartAndPreservesOrderHead|TestRefundEventRecoversWhenCentralAcceptsButAcknowledgementIsLost|TestV1RefundSyncLostAckRestartAndOrderingAcceptance|TestGetReconciliationSnapshotIncludesRefundSyncState)$' \
            -count=1 -v

      - name: Test complete POS package suite
        run: CGO_ENABLED=1 go test ./... -count=1

      - name: Vet POS Service
        run: go vet ./...
